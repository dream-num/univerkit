name: Release
run-name: Release${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and pack the packages without publishing or tagging.
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release runs from main only." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Pack packages
        run: pnpm -r --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Upload packed packages
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ github.sha }}
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish and tag
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required." >&2; exit 1; }
          printf '%s\n' '//insider-npm-registry.univer.work/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset publish
          git push origin --tags
